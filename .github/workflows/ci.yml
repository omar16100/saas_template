name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # lib/env.ts validates this at build time and at runtime; CI builds against a local origin.
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Committed migrations match the Drizzle schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            git status --porcelain -- db/migrations
            echo "::error::db/schema changed without a committed migration. Run pnpm db:generate and commit db/migrations."
            exit 1
          fi
      - name: Build (Next.js + OpenNext worker bundle)
        run: pnpm build:worker
      - name: Lighthouse (report only, does not block)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: >-
          npx @lhci/cli@0.14.x autorun
          --collect.startServerCommand="pnpm start"
          --collect.url=http://localhost:3000/
          --assert.preset=lighthouse:recommended
      - name: Keep Lighthouse reports
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
